appId: ${MAESTRO_APP_ID}
---
# iOS only. Start signed in, with no glasses paired.
# Set the phone microphone to denied before exercising real-glasses discovery.
# No physical glasses are needed to verify that discovery remains accessible.
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          permissions:
            all: allow
            microphone: deny
      - tapOn: "Glasses"
      - tapOn: "Connect Glasses"
      - assertVisible: "Before you begin"
      - tapOn: "Continue"
      - assertVisible: "Select your glasses"
      - tapOn:
          id: "pairing-model-mentra_live"
      - extendedWaitUntil:
          visible: "Turn on your glasses"
          timeout: 20000
      - assertVisible: "We're looking for your Mentra Live."
      - assertNotVisible: "Microphone Permission Required"
      - assertNotVisible: "Open Settings"
      - takeScreenshot: "ios-pairing-microphone-denied"
